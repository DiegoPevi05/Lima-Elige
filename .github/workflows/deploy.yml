name: Publicar en Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

permissions:
  contents: read

env:
  SSH_HOST: 145.14.151.58
  SSH_PORT: 65002
  SSH_USER: u996714911
  # Carpeta que sirve el dominio en Hostinger.
  REMOTE_DIR: /home/u996714911/domains/limaelige.digitalprocessit.com/public_html

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Los datos (src/data) y las fotos (public/img) ya están en el repo.
      - run: npm run build

      - name: Cargar clave SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Registrar el servidor en known_hosts
        run: |
          mkdir -p ~/.ssh
          # Clave del servidor fijada: si cambia, el despliegue falla en vez de confiar a ciegas.
          echo "[145.14.151.58]:65002 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINTReQpnKdDO2RCy/RoEAk9IcTg5Rc4WZvPuJAsQzA32" >> ~/.ssh/known_hosts

      - name: Crear la carpeta de destino si no existe
        run: ssh -p "$SSH_PORT" -o HostKeyAlgorithms=ssh-ed25519 "$SSH_USER@$SSH_HOST" "mkdir -p '$REMOTE_DIR'"

      - name: Copiar dist/ al hosting
        run: |
          rsync -az --human-readable --stats \
            -e "ssh -p $SSH_PORT -o HostKeyAlgorithms=ssh-ed25519" \
            dist/ "$SSH_USER@$SSH_HOST:$REMOTE_DIR/"
